name: Android アプリを作る

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # 最近のAndroidスマホ（arm64）向けだけに絞り、ファイルを小さくする
      - run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: lecture-notes-android
          path: build/app/outputs/flutter-apk/app-release.apk
      # main に入るたびに、スマホから直接ダウンロードできる「最新版」を更新する
      - name: 最新版としてダウンロードページに置く
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk lecture-notes.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest lecture-notes.apk --title "講義録 最新版" \
            --notes "スマホでこのページを開き、lecture-notes.apk をタップしてインストールしてください。（${GITHUB_SHA::7}）"
        env:
          GH_TOKEN: ${{ github.token }}
